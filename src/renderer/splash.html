<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self'" />
    <title>ShizoLauncher</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
        background: radial-gradient(circle at 50% 38%, #3a1a66 0%, #170d2e 55%, #0c0818 100%);
        color: #f5f0fb; font: 14px/1.4 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        -webkit-app-region: drag; border: 1px solid rgba(255, 255, 255, 0.08); box-sizing: border-box;
      }
      video { width: 190px; height: 190px; margin-top: -8px; }
      #status { font-weight: 700; font-size: 15px; letter-spacing: 0.2px; min-height: 21px; text-align: center; padding: 0 18px; }
      #detail { color: #a99fbd; font-size: 12px; min-height: 17px; text-align: center; padding: 0 18px; }
      .bar { width: 180px; height: 5px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); overflow: hidden; margin-top: 8px; visibility: hidden; }
      .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #9b45f5, #f03fd0); transition: width 0.15s; }
      .ver { position: absolute; bottom: 10px; color: #6f6585; font-size: 11px; }
    </style>
  </head>
  <body>
    <video src="assets/loading.webm" autoplay loop muted playsinline></video>
    <div id="status">Загрузка</div>
    <div id="detail"></div>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div class="ver" id="ver"></div>
  </body>
</html>
