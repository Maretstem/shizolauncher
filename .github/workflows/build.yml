# Сборка установщика на GitHub. Тег vX.Y.Z — ещё и релиз (лаунчеры игроков обновятся сами).
name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # создать релиз

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужен текст тега для описания релиза

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Тег совпадает с версией в package.json
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::Тег $GITHUB_REF_NAME, а в package.json версия $v"; exit 1; }

      - run: npm run dist

      - name: Сохранить установщик
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: release/*.exe
          if-no-files-found: error

      - name: Выпустить релиз
        if: env.RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout подменяет тег облегчённым — без этого описанием релиза станет текст коммита, а не тега
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.exe release/latest.yml --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.exe release/latest.yml --title "ShizoLauncher ${GITHUB_REF_NAME#v}" --notes-from-tag
          fi
